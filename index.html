<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1b2b1e" />
  <meta name="description" content="Bobirjon & Moxichexrabonu — nikoh to'yi taklifnomasi." />
  <title>Bobirjon & Moxichexrabonu — Nikoh To‘yi</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page" aria-label="Nikoh to‘yi taklifnomasi">
    <div class="artboard-wrap">
      <img id="invitation" class="invitation" alt="Bobirjon va Moxichexrabonu nikoh to'yi taklifnomasi" />
      <nav class="hotspots" aria-label="Sahifa bo‘limlari">
        <button class="hotspot hotspot-home" data-target="0" aria-label="Bosh sahifa"></button>
        <button class="hotspot hotspot-story" data-target="610" aria-label="Bizning hikoyamiz"></button>
        <button class="hotspot hotspot-about" data-target="930" aria-label="To‘y haqida"></button>
        <button class="hotspot hotspot-location" data-target="1120" aria-label="Manzil"></button>
        <button class="hotspot hotspot-rsvp" data-open-rsvp aria-label="RSVP"></button>
        <button class="hotspot hotspot-music" data-music-toggle aria-label="Musiqa"></button>
        <button class="hotspot hotspot-cta" data-open-rsvp aria-label="Tashrifni tasdiqlash"></button>
        <button class="hotspot hotspot-map" data-map aria-label="Yandex Maps"></button>
      </nav>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog class="rsvp" id="rsvpDialog" aria-labelledby="rsvpTitle">
    <div class="rsvp-inner">
      <button class="close" data-close-rsvp aria-label="Yopish">×</button>
      <p class="eyebrow">MEHMONLARGA</p>
      <h2 id="rsvpTitle">Tashrifingizni tasdiqlang</h2>
      <p>Sizni 30 sentyabr 2026 kuni Sherbudin to‘yimizda kutib qolamiz.</p>
      <form id="rsvpForm">
        <label>Ismingiz
          <input name="name" required autocomplete="name" placeholder="Ism Familiya" />
        </label>
        <label>Javobingiz
          <select name="attendance" required>
            <option value="">Tanlang</option>
            <option>Albatta kelaman</option>
            <option>Afsuski, kela olmayman</option>
          </select>
        </label>
        <label>Mehmonlar soni
          <input name="guests" type="number" min="1" max="10" value="1" />
        </label>
        <button class="submit" type="submit">Tasdiqlash ♡</button>
      </form>
    </div>
  </dialog>

  <audio id="weddingAudio" preload="none" loop></audio>
  <script src="app.js"></script>
</body>
</html>
